[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdexport"
version = "0.5.1"
description = "Export GitHub issues/PRs, Slack and Telegram messages, Gmail threads, Linear issues, Notion pages and Google Docs to local Markdown files"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "PyGithub>=2.1",
    "slack-sdk>=3.27",
    "httpx>=0.27",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "markdownify>=0.12",
    "telethon>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mdexport = "mdexport.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/mdexport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
